<!doctype html><meta charset="utf-8"><title>Live editing tests</title><pre id="results"></pre><iframe src="../index.html" style="width:100%;height:850px"></iframe>
<script>
if(location.search.includes('mobile'))document.querySelector('iframe').style.width='390px';
document.querySelector('iframe').addEventListener('load',async function(){const w=this.contentWindow,d=this.contentDocument,c=w.DriveMemoContent,out=document.querySelector('#results'),check=(name,ok)=>out.textContent+=(ok?'PASS ':'FAIL ')+name+'\n',pause=()=>new Promise(resolve=>setTimeout(resolve,250));
try{
const a=c.addBullet('',{action:'Original',details:'Original notes'}),p=c.addBullet(a.markdown,{action:'Project seed'});const editor=d.querySelector('#editor');editor.value=c.updateProject(c.convertToProject(p.markdown,p.bulletId),p.itemId,{title:'Existing project',details:'Project notes'});editor.dispatchEvent(new w.Event('input'));
const open=()=>d.querySelector('#agenda .bullet-main[data-id="'+a.bulletId+'"]').click(),notes=()=>d.querySelector('#projectRichEditor .outline-line');open();
check('buttons in requested order',Array.from(d.querySelectorAll('#bulletDialog .dialog-actions button')).map(b=>b.textContent).join('|')==='儲存|取消|完成|轉為專案Action|刪除');check('complete button is green',w.getComputedStyle(d.querySelector('#completeBulletBtn')).backgroundColor==='rgb(35, 134, 78)');if(w.innerWidth<=390)check('mobile buttons stay inside dialog',Array.from(d.querySelectorAll('#bulletDialog .dialog-actions button')).every(button=>button.getBoundingClientRect().right<=w.innerWidth));
notes().textContent='Live notes';notes().dispatchEvent(new w.Event('input',{bubbles:true}));await pause();check('notes update before save and enter sync queue',c.getBullet(editor.value,a.bulletId).details.includes('Live notes')&&w.DriveMemoUI.sync.getDebugSnapshot().localDirty);
d.querySelector('#cancelBulletBtn').click();await pause();check('cancel restores original notes and closes',c.getBullet(editor.value,a.bulletId).details==='Original notes'&&!d.querySelector('#bulletDialog').open);
open();d.querySelector('#bulletAction').value='Completed title';d.querySelector('#completeBulletBtn').click();check('complete saves current fields and closes',c.getBullet(editor.value,a.bulletId).status==='done'&&c.getBullet(editor.value,a.bulletId).action==='Completed title'&&!d.querySelector('#bulletDialog').open);
open();d.querySelector('#convertProjectBtn').click();d.querySelector('#convertProjectSelect').value=p.itemId;d.querySelector('#convertProjectSelect').dispatchEvent(new w.Event('change'));d.querySelector('#convertForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));check('conversion selects existing project',c.getBullet(editor.value,a.bulletId).itemId===p.itemId&&c.getProjects(editor.value).length===1);
d.querySelector('[data-action="edit-project"]').click();notes().textContent='Live project notes';await pause();check('project content syncs while editing',c.getProjects(editor.value)[0].details.includes('Live project notes'));d.querySelector('#cancelBulletBtn').click();check('project cancel restores original content',c.getProjects(editor.value)[0].details==='Project notes');
d.querySelector('#quickMemoBtn').click();notes().textContent='New draft';await pause();const draftId=d.querySelector('#bulletId').value;check('new Action gets a single draft id',Boolean(c.getBullet(editor.value,draftId)));d.querySelector('#cancelBulletBtn').click();check('cancel removes auto-synced new draft',!c.getBullet(editor.value,draftId));
d.querySelector('#quickMemoBtn').click();notes().textContent='Saved notes';await pause();const savedId=d.querySelector('#bulletId').value;d.querySelector('#bulletForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));check('save keeps notes, closes and clears editor undo state',c.getBullet(editor.value,savedId).details.includes('Saved notes')&&!d.querySelector('#bulletDialog').open&&!d.querySelector('#projectRichEditor').textContent.trim());
d.querySelector('#agenda .bullet-main[data-id="'+savedId+'"]').click();notes().dispatchEvent(new w.InputEvent('beforeinput',{bubbles:true,inputType:'insertText'}));notes().textContent='Undo edit';await pause();d.querySelector('[data-detail-tool="undo"]').click();await pause();check('Undo changes are synchronized too',c.getBullet(editor.value,savedId).details.includes('Saved notes')&&!c.getBullet(editor.value,savedId).details.includes('Undo edit'));d.querySelector('#convertProjectBtn').click();d.querySelector('#convertProjectName').value='New project';d.querySelector('#convertForm').dispatchEvent(new w.Event('submit',{cancelable:true,bubbles:true}));check('conversion can create project and retains Action notes',c.getProjects(editor.value).length===2&&c.getBullet(editor.value,savedId).title==='New project'&&c.getBullet(editor.value,savedId).details.includes('Saved notes'));
d.querySelector('#agenda .bullet-main[data-id="'+savedId+'"]').click();d.querySelector('#completeBulletBtn').click();check('project Action completion closes editor',c.getBullet(editor.value,savedId).status==='done'&&!d.querySelector('#bulletDialog').open);
}catch(error){out.textContent+='FAIL '+error.stack}
});
</script>
