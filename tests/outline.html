<!doctype html><meta charset="utf-8"><title>Outline regression tests</title>
<pre id="results"></pre><div id="editor"></div><script src="../outline.js"></script>
<script>
const root=document.querySelector('#editor'),output=document.querySelector('#results');
const editor=DriveMemoOutline.create(root,{sanitize:s=>s,decorate:()=>{}});
const line=()=>root.querySelector('.outline-line');
function focus(node){node.focus();const r=document.createRange();r.selectNodeContents(node);r.collapse(false);getSelection().removeAllRanges();getSelection().addRange(r);editor.remember()}
function check(name,fn){try{fn();output.textContent+='PASS '+name+'\n'}catch(e){output.textContent+='FAIL '+name+': '+e.message+'\n'}}
function assert(ok){if(!ok)throw Error('assertion failed')}
check('legacy lines and nested bullets',()=>{editor.load('<details open><summary>A</summary><div class="outline-body"><p>B</p><p>C</p></div></details>');assert(root.querySelectorAll('.outline-line').length===3)});
check('collapse and expand descendants',()=>{focus(line());editor.expand(false);assert([...root.querySelectorAll('.outline-node')].every(n=>!n.open));editor.expand(true);assert([...root.querySelectorAll('.outline-node')].every(n=>n.open))});
check('Tab and Shift+Tab',()=>{editor.load('<p>A</p><p>B</p><p>C</p>');focus(root.children[1].firstChild);root.children[1].firstChild.dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true}));assert(root.children.length===2);root.querySelector('.outline-children .outline-line').dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',shiftKey:true,bubbles:true,cancelable:true}));assert(root.children.length===3)});
check('multi-select move preserves order',()=>{editor.toggleSelection();root.children[1].firstChild.click();root.children[2].firstChild.click();editor.move(-1);assert([...root.children].map(n=>n.textContent).join('')==='BCA');editor.move(1);assert([...root.children].map(n=>n.textContent).join('')==='ABC');editor.toggleSelection()});
check('ArrowDown and ArrowUp change bullet',()=>{focus(line());line().dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));assert(getSelection().anchorNode===root.children[1].firstChild);document.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true,cancelable:true}));assert(getSelection().anchorNode===line())});
check('recolor existing text',()=>{focus(line());editor.format('color','#f48771');editor.format('color','#9cdcfe');assert(getComputedStyle(line().querySelector('span span')||line().querySelector('span')).color==='rgb(156, 220, 254)')});
check('upload placeholder uses standard Pic link',()=>{focus(line());const pending=editor.placeholder('photo.png'),description=root.children[1].querySelector('span');description.textContent='My description';pending.complete('https://example.com/photo.png');assert(root.children[1].querySelector('a').textContent==='【Pic】');assert(!root.querySelector('.upload-placeholder'))});
check('cancelled draft does not receive uploaded link',()=>{const pending=editor.placeholder('cancel.png');editor.load('<p>New draft</p>');pending.complete('https://example.com/cancel.png');assert(!root.querySelector('a'))});
check('multi indent outdent and undo',()=>{editor.load('<p>A</p><p>B</p><p>C</p>');editor.toggleSelection();root.children[1].firstChild.click();root.children[2].firstChild.click();editor.indent();assert(root.children.length===1);assert(root.querySelector('.outline-children').children.length===2);editor.indent(true);assert([...root.children].map(n=>n.firstChild.textContent).join('')==='ABC');editor.removeSelected();assert(root.children.length===1);editor.undo();assert(root.children.length===3)});
check('shared editing host permits cross-line range',()=>{editor.load('<p>A</p><p>B</p>');assert(root.contentEditable==='true');assert(!root.querySelector('[contenteditable=true]'));const r=document.createRange();r.setStart(root.children[0].firstChild.firstChild,0);r.setEnd(root.children[1].firstChild.firstChild,1);getSelection().removeAllRanges();getSelection().addRange(r);assert(getSelection().toString().includes('A')&&getSelection().toString().includes('B'))});
check('mobile paragraph input leaves caret at empty line start',()=>{focus(line());root.dispatchEvent(new InputEvent('beforeinput',{inputType:'insertParagraph',bubbles:true,cancelable:true}));assert(root.children.length===3);assert(getSelection().anchorNode===root.children[1].firstChild&&getSelection().anchorOffset===0);assert(root.children[1].firstChild.isContentEditable)});
check('browser inserts text at new empty bullet',()=>{document.execCommand('insertText',false,'新');assert(root.children[1].firstChild.textContent==='新')});
check('plain editing nodes persist legacy details and restore nesting',()=>{editor.load('<details open><summary>A</summary><div class="outline-children"><details><summary>B</summary></details></div></details>');assert(!root.querySelector('details,summary'));const html=editor.html();assert(html.includes('<details')&&html.includes('<summary>'));editor.load(html);assert(root.querySelectorAll('.outline-node').length===2);assert(!root.querySelector('.outline-children').firstChild.open)});
(async()=>{let value='';Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async text=>{value=text},readText:async()=>value}});try{editor.load('<p>A</p><p>B</p><p>C</p>');editor.toggleSelection();root.children[1].firstChild.click();root.children[2].firstChild.click();await editor.copy();assert(value==='B\nC');await editor.copy(true);assert(root.children.length===1);await editor.paste();assert([...root.children].map(n=>n.textContent).join('')==='ABC');editor.undo();assert(root.children.length===1);output.textContent+='PASS clipboard copy cut paste and undo\n'}catch(e){output.textContent+='FAIL clipboard operations: '+e.message+'\n'}})();
</script>
