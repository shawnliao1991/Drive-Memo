<!doctype html><meta charset="utf-8"><title>Action structure tests</title><pre id="results"></pre><iframe src="../index.html" style="width:100%;height:800px"></iframe>
<script>
document.querySelector('iframe').addEventListener('load',function(){const w=this.contentWindow,d=this.contentDocument,c=w.DriveMemoContent,out=document.querySelector('#results');function check(name,ok){out.textContent+=(ok?'PASS ':'FAIL ')+name+'\n'}
const a=c.addBullet('',{title:'客戶、確認需求',action:'客戶、確認需求',details:'獨立細節'});let text=c.convertToProject(a.markdown,a.bulletId);text=c.updateProject(text,a.itemId,{title:'網站改版',details:'<!-- DRIVE_MEMO_RICH_DETAILS_V1 --><details open><summary>第一階</summary><div class="outline-children"><details><summary>第二階</summary></details></div></details><details open><summary>獨立第一階</summary></details>'});const b=c.addProjectAction(text,a.itemId,{action:'已完成 Action'});text=c.setBulletStatus(b.markdown,b.bulletId,'done');const general=c.addBullet(text,{action:'一般對象、做什麼',details:'一般細節'});const editor=d.querySelector('#editor');editor.value=general.markdown;editor.dispatchEvent(new w.Event('input'));
function swipe(node,from,to,pointerId){node.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId,button:0,clientX:from,clientY:100}));node.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId,button:0,clientX:to,clientY:102}));node.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId,button:0,clientX:to,clientY:102}))}
const card=d.querySelector('[data-id="'+a.bulletId+'"].bullet');check('Action title and project subtitle',card.querySelector('.bullet-title').textContent==='客戶、確認需求'&&card.querySelector('.bullet-action').textContent==='網站改版');check('general Action has no subtitle or details',!d.querySelector('[data-id="'+general.bulletId+'"].bullet .bullet-action')&&!d.querySelector('#agenda').textContent.includes('一般細節'));d.querySelector('[data-id="'+general.bulletId+'"] .bullet-main').click();check('general Action has no related Action block',d.querySelector('#bulletHistoryField').classList.contains('hidden'));d.querySelector('#cancelBulletBtn').click();
check('project list only unfinished',d.querySelectorAll('#projectsList .project-action-row').length===1);const previewNodes=d.querySelectorAll('#projectsList .project-details-render>details'),parentSummary=previewNodes[0].querySelector(':scope>summary'),leafSummary=previewNodes[1].querySelector(':scope>summary');check('preview starts at first level',Array.from(previewNodes).every(node=>!node.open)&&previewNodes[0].querySelector('.outline-children').getBoundingClientRect().height===0);check('preview uses triangle only for parents',w.getComputedStyle(parentSummary).listStyleType==='disclosure-closed'&&w.getComputedStyle(leafSummary).listStyleType==='disc');check('preview indentation matches editor',w.getComputedStyle(parentSummary).marginLeft==='22px');
d.querySelector('[data-id="'+a.bulletId+'"] .bullet-main').click();check('separate Action editor',d.querySelector('#projectRichEditor').textContent.includes('獨立細節')&&!d.querySelector('#projectRichEditor').textContent.includes('第一階'));check('project content collapsed',!d.querySelector('#actionProjectContent').open&&d.querySelector('#actionProjectPreview').textContent.includes('第一階'));check('project Action shows related unfinished Actions only',d.querySelector('#bulletHistoryField label').textContent==='相關Action'&&d.querySelectorAll('#bulletHistory .history-row').length===1&&!d.querySelector('#bulletHistory').textContent.includes('已完成 Action'));d.querySelector('#cancelBulletBtn').click();
d.querySelector('[data-action="edit-project"]').click();check('project content fully expanded',Array.from(d.querySelectorAll('#projectRichEditor .outline-node')).every(n=>n.open));check('completed Actions collapsed',!d.querySelector('#projectEditorActions details').open&&d.querySelectorAll('#projectEditorActions .done').length===1);check('unfinished labels use one blue',Array.from(d.querySelectorAll('.unfinished-text')).every(node=>w.getComputedStyle(node).color==='rgb(77, 170, 252)'));swipe(d.querySelector('#projectEditorActions .project-action-row:not(.done)'),100,190,21);check('right swipe completes Action in project editor',c.getBullet(editor.value,a.bulletId).status==='done');d.querySelector('#projectEditorActions details').open=true;swipe(d.querySelector('#projectEditorActions .project-action-row.done'),190,90,22);check('left swipe deletes Action in project editor',c.getBullet(editor.value,a.bulletId).deletedAt&&c.getTrash(editor.value).some(action=>action.id===a.bulletId));check('ordinary priority label',d.querySelector('[data-priority="someday"]').textContent==='普通');
});
</script>
