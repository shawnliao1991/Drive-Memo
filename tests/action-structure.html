<!doctype html><meta charset="utf-8"><title>Action structure tests</title><pre id="results"></pre><iframe src="../index.html" style="width:100%;height:800px"></iframe>
<script>
document.querySelector('iframe').addEventListener('load',function(){const w=this.contentWindow,d=this.contentDocument,c=w.DriveMemoContent,out=document.querySelector('#results');function check(name,ok){out.textContent+=(ok?'PASS ':'FAIL ')+name+'\n'}
const a=c.addBullet('',{title:'客戶、確認需求',action:'客戶、確認需求',details:'獨立細節'});let text=c.convertToProject(a.markdown,a.bulletId);text=c.updateProject(text,a.itemId,{title:'網站改版',details:'<!-- DRIVE_MEMO_RICH_DETAILS_V1 --><details open><summary>第一階</summary><div class="outline-children"><details><summary>第二階</summary></details></div></details>'});const b=c.addProjectAction(text,a.itemId,{action:'已完成 Action'});text=c.setBulletStatus(b.markdown,b.bulletId,'done');const general=c.addBullet(text,{action:'一般對象、做什麼',details:'一般細節'});const editor=d.querySelector('#editor');editor.value=general.markdown;editor.dispatchEvent(new w.Event('input'));
const card=d.querySelector('[data-id="'+a.bulletId+'"].bullet');check('Action title and project subtitle',card.querySelector('.bullet-title').textContent==='客戶、確認需求'&&card.querySelector('.bullet-action').textContent==='網站改版');check('general Action has no subtitle or details',!d.querySelector('[data-id="'+general.bulletId+'"].bullet .bullet-action')&&!d.querySelector('#agenda').textContent.includes('一般細節'));
check('project list only unfinished',d.querySelectorAll('#projectsList .project-action-row').length===1);check('preview starts at first level',!d.querySelector('#projectsList .project-details-render details').open);
card.querySelector('.bullet-main').click();check('separate Action editor',d.querySelector('#projectRichEditor').textContent.includes('獨立細節')&&!d.querySelector('#projectRichEditor').textContent.includes('第一階'));check('project content collapsed',!d.querySelector('#actionProjectContent').open&&d.querySelector('#actionProjectPreview').textContent.includes('第一階'));d.querySelector('#cancelBulletBtn').click();
d.querySelector('[data-action="edit-project"]').click();check('project content fully expanded',Array.from(d.querySelectorAll('#projectRichEditor .outline-node')).every(n=>n.open));check('completed Actions collapsed',!d.querySelector('#projectEditorActions details').open&&d.querySelectorAll('#projectEditorActions .done').length===1);check('unfinished label blue',w.getComputedStyle(d.querySelector('#projectEditorActions h4')).color==='rgb(77, 170, 252)');
});
</script>
