<!doctype html><meta charset="utf-8"><title>Desktop Action panel tests</title><pre id="results"></pre><iframe src="../index.html" style="width:1250px;height:800px;border:0"></iframe>
<script>
if(location.search.includes('mobile'))document.querySelector('iframe').style.width='390px';
document.querySelector('iframe').addEventListener('load',async function(){const w=this.contentWindow,d=this.contentDocument,c=w.DriveMemoContent,out=document.querySelector('#results'),check=(name,ok)=>out.textContent+=(ok?'PASS ':'FAIL ')+name+'\n',wait=()=>new Promise(resolve=>setTimeout(resolve,250));try{
const first=c.addBullet('',{action:'First Action',details:Array.from({length:60},(_,i)=>'Detail line '+i).join('\n')}),second=c.addBullet(first.markdown,{action:'Second Action',details:'Second notes'});let text=second.markdown;for(let i=0;i<25;i++)text=c.addBullet(text,{action:'List Action '+i}).markdown;d.querySelector('#editor').value=text;d.querySelector('#editor').dispatchEvent(new w.Event('input'));
const layout=d.querySelector('.journal-layout'),timeline=d.querySelector('.journal-timeline'),beforeLayout=layout.getBoundingClientRect(),beforeTimeline=timeline.getBoundingClientRect();d.querySelector('#agenda .bullet-main[data-id="'+first.bulletId+'"]').click();await wait();const dialog=d.querySelector('#bulletDialog'),body=dialog.querySelector('.dialog-body'),afterLayout=layout.getBoundingClientRect(),afterTimeline=timeline.getBoundingClientRect();
if(w.innerWidth<=820){check('mobile remains a full-screen modal',dialog.matches(':modal')&&!dialog.classList.contains('docked-action'));d.querySelector('#cancelBulletBtn').click();check('mobile cancel closes',!dialog.open);return}
check('desktop opens a nonmodal right panel',dialog.open&&!dialog.matches(':modal')&&dialog.parentElement.matches('.journal-sidebar')&&dialog.getBoundingClientRect().left>=timeline.getBoundingClientRect().right);
check('opening editor keeps desktop columns stable',Math.abs(beforeLayout.left-afterLayout.left)<1&&Math.abs(beforeLayout.width-afterLayout.width)<1&&Math.abs(beforeTimeline.left-afterTimeline.left)<1&&Math.abs(beforeTimeline.width-afterTimeline.width)<1);
check('Action list scrollbar is on the left',w.getComputedStyle(timeline).direction==='rtl'&&w.getComputedStyle(timeline.firstElementChild).direction==='ltr');
let selected=d.querySelectorAll('.bullet.selected-action');check('clicked Action is subtly highlighted',selected.length===1&&selected[0].dataset.id===first.bulletId&&selected[0].getAttribute('aria-current')==='true');
check('calendar hidden while editing',w.getComputedStyle(d.querySelector('#journalCalendar')).display==='none');check('both panes can scroll',timeline.scrollHeight>timeline.clientHeight&&body.scrollHeight>body.clientHeight);
const pageScroll=w.scrollY;timeline.scrollTop=140;const leftScroll=timeline.scrollTop;body.scrollTop=200;check('pane scrolling is independent',leftScroll>0&&body.scrollTop>0&&timeline.scrollTop===leftScroll&&w.scrollY===pageScroll);
body.scrollTop=0;const line=d.querySelector('#projectRichEditor .outline-line');line.textContent='Edited first notes';line.dispatchEvent(new w.Event('input',{bubbles:true}));d.querySelector('#agenda .bullet-main[data-id="'+second.bulletId+'"]').click();await wait();check('switching Actions saves and stays docked',c.getBullet(d.querySelector('#editor').value,first.bulletId).details.includes('Edited first notes')&&dialog.open&&!dialog.matches(':modal')&&d.querySelector('#bulletAction').value==='Second Action');selected=d.querySelectorAll('.bullet.selected-action');check('highlight follows the selected Action',selected.length===1&&selected[0].dataset.id===second.bulletId);
d.querySelector('#completeBulletBtn').click();await wait();check('complete closes panel and restores calendar',!dialog.open&&!d.body.classList.contains('action-dock-open')&&w.getComputedStyle(d.querySelector('#journalCalendar')).display!=='none'&&c.getBullet(d.querySelector('#editor').value,second.bulletId).status==='done');check('closing editor clears Action highlight',!d.querySelector('.bullet.selected-action')&&!d.querySelector('.bullet[aria-current="true"]'));
d.querySelector('#agenda .bullet-main[data-id="'+first.bulletId+'"]').click();await wait();const other=d.querySelector('#agenda .bullet-main[data-id="'+second.bulletId+'"]').closest('article');for(const [type,x] of [['pointerdown',100],['pointermove',190],['pointerup',190]])other.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,button:0,pointerId:91,clientX:x,clientY:100}));d.querySelector('#cancelBulletBtn').click();check('cancel preserves changes to another Action in the left list',c.getBullet(d.querySelector('#editor').value,second.bulletId).status==='todo');check('cancel restores calendar and original dialog location',!dialog.open&&dialog.parentElement===d.body&&!d.body.classList.contains('action-dock-open'));
d.querySelector('#agenda .bullet-main[data-id="'+first.bulletId+'"]').click();await wait();this.style.width='390px';await wait();check('resize to mobile keeps editor open as modal',dialog.open&&dialog.matches(':modal')&&!d.body.classList.contains('action-dock-open'));this.style.width='900px';await wait();check('resize back to desktop docks without losing content',dialog.open&&!dialog.matches(':modal')&&dialog.classList.contains('docked-action')&&d.querySelector('#projectRichEditor').textContent.includes('Edited first notes'));d.querySelector('#projectsNav').click();await wait();check('navigation closes editor and unlocks page scrolling',!dialog.open&&!d.body.classList.contains('action-dock-open')&&!d.querySelector('#projectsPage').classList.contains('hidden'));
}catch(error){out.textContent+='FAIL '+error.stack}});
</script>
