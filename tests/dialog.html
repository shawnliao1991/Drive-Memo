<!doctype html><meta charset="utf-8"><title>Dialog regression tests</title>
<style>body{margin:0;background:#111;color:white}iframe{width:390px;height:600px;border:0}</style>
<pre id="results"></pre><iframe src="../index.html" title="Editor tests"></iframe>
<script>
if(location.search.includes('desktop'))document.querySelector('iframe').style.width='1100px';
document.querySelector('iframe').addEventListener('load',function(){
 const w=this.contentWindow,d=this.contentDocument,c=w.DriveMemoContent,out=document.querySelector('#results');
 function check(name,fn){try{if(!fn())throw Error('assertion failed');out.textContent+='PASS '+name+'\n'}catch(e){out.textContent+='FAIL '+name+': '+e.message+'\n'}}
 d.querySelector('[data-action=add-day]').click();
 check('dialog actions sit beside content label',()=>d.querySelector('.field-label-row>.inline-dialog-actions')&&d.querySelector('.inline-dialog-actions #cancelBulletBtn')&&d.querySelector('.inline-dialog-actions [type=submit]'));
 const body=d.querySelector('#bulletDialog .dialog-body'),editor=d.querySelector('#projectRichEditor'),line=editor.querySelector('.outline-line');
 line.textContent='字級測試';line.focus();const r=d.createRange();r.selectNodeContents(line);w.getSelection().removeAllRanges();w.getSelection().addRange(r);line.dispatchEvent(new w.KeyboardEvent('keyup',{bubbles:true}));
 check('background scroll locked',()=>w.getComputedStyle(d.documentElement).overflow==='hidden');
 check('editor owns scroll area',()=>w.getComputedStyle(body).overflowY==='scroll'&&body.scrollHeight>body.clientHeight&&w.getComputedStyle(body).overscrollBehavior==='contain');
 check('disclosure icons',()=>d.querySelector('[data-detail-tool=expand]').textContent==='▼'&&d.querySelector('[data-detail-tool=collapse]').textContent==='▶');
 d.querySelector('[data-detail-tool=sizes]').click();
 check('size popover visible and no dropdown',()=>!d.querySelector('#projectTextSize').classList.contains('hidden')&&!d.querySelector('#projectTextSize select'));
 check('popover adjacent to button',()=>{const p=d.querySelector('#projectTextSize').getBoundingClientRect(),b=d.querySelector('[data-detail-tool=sizes]').getBoundingClientRect();return Math.abs((w.innerWidth<=820?b.top-p.bottom:b.left-p.right)-10)<2&&p.left>=0&&p.right<=w.innerWidth});
 d.querySelector('[data-font-size="32px"]').click();
 check('larger text applied and popover closed',()=>w.getComputedStyle(line.querySelector('span')).fontSize==='32px'&&d.querySelector('#projectTextSize').classList.contains('hidden'));
 d.querySelector('[data-detail-tool=colors]').click();
 check('color wheel and popover',()=>w.getComputedStyle(d.querySelector('.color-wheel')).backgroundImage.includes('conic-gradient')&&!d.querySelector('#projectTextColors').classList.contains('hidden'));
 d.querySelector('#cancelBulletBtn').click();
 check('background scroll restored',()=>w.getComputedStyle(d.documentElement).overflow!=='hidden');
 d.querySelector('[data-action=add-day]').click();
 check('unused tools removed and indentation swapped',()=>!d.querySelector('[data-detail-tool=bold]')&&!d.querySelector('[data-detail-tool=add-block]')&&Boolean(d.querySelector('[data-detail-tool=outdent]').compareDocumentPosition(d.querySelector('[data-detail-tool=indent]'))&w.Node.DOCUMENT_POSITION_FOLLOWING));
 d.querySelector('[data-detail-tool=select]').click();
 check('multi-select tools in popup',()=>!d.querySelector('#multiTools').classList.contains('hidden')&&d.querySelector('#multiTools [data-detail-tool=move-up]')&&d.querySelector('#multiTools [data-detail-tool=delete-lines]'));
 if(w.innerWidth<=820)check('mobile date and priority share row',()=>d.querySelector('#actionDateField').getBoundingClientRect().top===d.querySelector('#actionPriorityField').getBoundingClientRect().top);
 const del=d.querySelector('#deleteBulletBtn');del.classList.remove('hidden');
 if(w.innerWidth<=820)check('mobile delete and save share row',()=>Math.abs(del.getBoundingClientRect().top-d.querySelector('#bulletForm [type=submit]').getBoundingClientRect().top)<2);
 d.querySelector('#projectRichEditor .outline-line').click();
 d.querySelector('[data-detail-tool=delete-lines]').click();
 check('delete requires confirmation',()=>d.querySelector('#outlineDeleteDialog').open&&d.querySelector('#projectRichEditor .outline-line'));
 d.querySelector('#cancelOutlineDelete').click();
 check('cancel delete keeps line',()=>!d.querySelector('#outlineDeleteDialog').open&&d.querySelector('#projectRichEditor .outline-line'));
 d.querySelector('#cancelBulletBtn').click();const project=c.addBullet('',{action:'專案 Action',date:c.localDateKey(),priority:'today'}),store=d.querySelector('#editor');store.value=c.convertToProject(project.markdown,project.bulletId);store.dispatchEvent(new w.Event('input'));d.querySelector(`[data-action=open][data-id="${project.bulletId}"]`).click();
 check('project Action title bar removed',()=>d.querySelector('#bulletDialog').classList.contains('compact-project-action')&&w.getComputedStyle(d.querySelector('#bulletDialog .dialog-head')).display==='none');
 check('project content row owns delete cancel save',()=>{const row=d.querySelector('#bulletDetailsLabel').closest('.field-label-row');return ['deleteBulletBtn','cancelBulletBtn'].every(id=>row.querySelector('#'+id))&&row.querySelector('[type=submit]')});
});
</script>
