<!doctype html><meta charset="utf-8"><title>Dialog regression tests</title>
<style>body{margin:0;background:#111;color:white}iframe{width:390px;height:600px;border:0}</style>
<pre id="results"></pre><iframe src="../index.html" title="Editor tests"></iframe>
<script>
if(location.search.includes('desktop'))document.querySelector('iframe').style.width='1100px';
document.querySelector('iframe').addEventListener('load',function(){
 const w=this.contentWindow,d=this.contentDocument,out=document.querySelector('#results');
 function check(name,fn){try{if(!fn())throw Error('assertion failed');out.textContent+='PASS '+name+'\n'}catch(e){out.textContent+='FAIL '+name+': '+e.message+'\n'}}
 d.querySelector('[data-action=add-day]').click();
 const body=d.querySelector('#bulletDialog .dialog-body'),editor=d.querySelector('#projectRichEditor'),line=editor.querySelector('summary');
 line.textContent='字級測試';line.focus();const r=d.createRange();r.selectNodeContents(line);w.getSelection().removeAllRanges();w.getSelection().addRange(r);line.dispatchEvent(new w.KeyboardEvent('keyup',{bubbles:true}));
 check('background scroll locked',()=>w.getComputedStyle(d.documentElement).overflow==='hidden');
 check('editor owns scroll area',()=>w.getComputedStyle(body).overflowY==='scroll'&&body.scrollHeight>body.clientHeight&&w.getComputedStyle(body).overscrollBehavior==='contain');
 check('disclosure icons',()=>d.querySelector('[data-detail-tool=expand]').textContent==='▼'&&d.querySelector('[data-detail-tool=collapse]').textContent==='▶');
 d.querySelector('[data-detail-tool=sizes]').click();
 check('size popover visible and no dropdown',()=>!d.querySelector('#projectTextSize').classList.contains('hidden')&&!d.querySelector('#projectTextSize select'));
 check('popover adjacent to button',()=>{const p=d.querySelector('#projectTextSize').getBoundingClientRect(),b=d.querySelector('[data-detail-tool=sizes]').getBoundingClientRect();return Math.abs((w.innerWidth<=820?b.top-p.bottom:b.left-p.right)-10)<2&&p.left>=0&&p.right<=w.innerWidth});
 d.querySelector('[data-font-size="32px"]').click();
 check('larger text applied and popover closed',()=>w.getComputedStyle(line.querySelector('span')).fontSize==='32px'&&d.querySelector('#projectTextSize').classList.contains('hidden'));
 d.querySelector('[data-detail-tool=colors]').click();
 check('color wheel and popover',()=>w.getComputedStyle(d.querySelector('.color-wheel')).backgroundImage.includes('conic-gradient')&&!d.querySelector('#projectTextColors').classList.contains('hidden'));
 d.querySelector('#cancelBulletBtn').click();
 check('background scroll restored',()=>w.getComputedStyle(d.documentElement).overflow!=='hidden');
});
</script>
