<!doctype html><meta charset="utf-8"><title>Notes integration</title>
<pre id="result">RUNNING</pre><iframe src="../index.html#notes"></iframe>
<script>
document.querySelector("iframe").onload=function(){
 const w=this.contentWindow,d=w.document,C=w.DriveMemoContent,status=document.getElementById("result");
 const check=(condition,msg)=>{if(!condition)throw Error(msg)};
 try{
 const page=d.querySelector("#notesPage"),getBook=()=>C.parse(d.querySelector("#editor").value).journal.notes;
 check(!page.classList.contains("hidden"),"notes route");
 const add=(column,name)=>{page.querySelectorAll(".note-add")[column].click();const form=page.querySelector("dialog[open] form");form.querySelector("input").value=name;form.requestSubmit()};
 const press=(el,key,opts={})=>el.dispatchEvent(new w.KeyboardEvent("keydown",{key,bubbles:true,cancelable:true,...opts}));
 const fields=()=>[...page.querySelectorAll("[data-editor]")];
 add(0,"Folder");add(1,"First");
 const type=(i,value)=>{const field=fields()[i];field.value=value;field.dispatchEvent(new w.Event("input",{bubbles:true}));field.setSelectionRange(value.length,value.length)};
 type(0,"Parent");press(fields()[0],"Enter",{isComposing:true});check(fields().length===1,"IME confirmation");
 press(fields()[0],"Enter");type(1,"Child");press(fields()[1],"Tab");
 check(getBook()[0].rows[1].depth===1,"child indentation");
 press(fields()[0],"ArrowDown",{shiftKey:true});check(page.querySelectorAll(".note-row.selected").length===1,"first Shift selects current row");press(fields()[0],"ArrowDown",{shiftKey:true});
 const clipboard=new w.DataTransfer();fields()[1].dispatchEvent(new w.ClipboardEvent("copy",{bubbles:true,cancelable:true,clipboardData:clipboard}));
 check(clipboard.getData("text/plain")==="- Parent\n  - Child","plain bullets");
 add(1,"Second");
 fields()[0].dispatchEvent(new w.ClipboardEvent("paste",{bubbles:true,cancelable:true,clipboardData:clipboard}));
 check(getBook()[1].rows[1].depth===1,"cross-note paste");
 press(fields()[1],"ArrowUp",{ctrlKey:true});check(getBook()[1].rows[0].text==="Child","keyboard reorder");
 press(fields()[0],"ArrowDown",{shiftKey:true});press(fields()[0],"ArrowDown",{shiftKey:true});press(fields()[1],"Delete");
 check(getBook()[1].rows.length===0&&fields().length===1,"empty note with one input");
 type(0,"Again");check(getBook()[1].rows.length===1,"empty input reused");
 const urlClip=new w.DataTransfer();urlClip.setData("text/plain","https://example.org/");
 fields()[0].dispatchEvent(new w.ClipboardEvent("paste",{bubbles:true,cancelable:true,clipboardData:urlClip}));
 check(getBook()[1].rows[1].type==="link","automatic URL row");
 page.querySelectorAll(".note-column")[1].querySelector("button.note-card-name").click();
 page.querySelector(".tree-fold").click();check(fields().length===1,"fold hides descendants");
 press(fields()[0],"Enter");check(getBook()[0].rows[1].depth===1&&fields().length===3,"Enter opens branch and adds child");
 press(fields()[1],"PageDown");check(d.activeElement===fields()[2],"last sibling");press(fields()[2],"PageUp");check(d.activeElement===fields()[1],"first sibling");
 add(1,"Keyboard");
 type(0,"123");press(fields()[0],"Enter");type(1,"456");press(fields()[1],"Enter");type(2,"789");
 fields()[2].setSelectionRange(2,2);press(fields()[2],"ArrowUp");
 check(d.activeElement===fields()[1]&&fields()[1].selectionStart===3,"one press to previous end");
 fields()[1].setSelectionRange(1,1);press(fields()[1],"ArrowDown");
 check(d.activeElement===fields()[2]&&fields()[2].selectionStart===0,"one press to next start");
 press(fields()[1],"ArrowDown",{shiftKey:true});press(fields()[1],"ArrowDown",{shiftKey:true});
 press(fields()[2],"ArrowUp",{ctrlKey:true});
 check(page.querySelectorAll(".note-row.selected").length===2&&fields()[0].value==="456","selection follows moved rows");
 press(d.activeElement,"Escape");const caret=d.activeElement;press(caret,"Escape");
 check(!page.querySelector(".note-row.selected")&&d.activeElement===caret,"Escape clears selection and retains focus");
 fields()[0].setSelectionRange(3,3);press(fields()[0],"Delete");
 check(fields().length===2&&fields()[0].value==="456789"&&fields()[0].selectionStart===3,"forward boundary merge");
 const undo=()=>press(fields()[0],"z",{ctrlKey:true});
 undo();check(fields().map(f=>f.value).join(",")==="456,789,123","undo merge");
 undo();check(fields().map(f=>f.value).join(",")==="123,456,789"&&page.querySelectorAll(".note-row.selected").length===2,"undo reorder and restore selection");
 press(d.activeElement,"Escape");const beforeIndent=getBook().at(-1).rows.map(r=>r.depth);
 press(fields()[1],"Tab");undo();check(getBook().at(-1).rows.every((r,i)=>r.depth===beforeIndent[i]),"undo indent");
 undo();check(fields()[2].value==="","undo text input");
 undo();check(fields().length===2,"undo split");
 const pasteAt=pos=>{const f=fields()[0];f.focus();f.setSelectionRange(pos,pos);f.dispatchEvent(new w.ClipboardEvent("paste",{bubbles:true,cancelable:true,clipboardData:clipboard}))};
 const original=JSON.stringify(getBook().at(-1).rows);
 pasteAt(1);check(JSON.stringify(getBook().at(-1).rows)===original,"block paste in middle ignored");
 pasteAt(0);check(fields()[0].value==="Parent"&&fields()[2].value==="123","block pasted before caret row");
 undo();check(JSON.stringify(getBook().at(-1).rows)===original,"undo block paste");
 pasteAt(3);check(fields()[0].value==="123"&&fields()[1].value==="Parent"&&getBook().at(-1).rows[2].depth===1,"block pasted after caret row with hierarchy");
 undo();
 page.querySelector(".note-info").click();check(page.querySelector(".note-instructions[open] li"),"instructions popup");
 page.querySelector(".note-instructions button").click();
 check(!d.querySelector("a[href='#projects']"),"old navigation");
 const first=C.addBullet("",{title:"A",action:"A",details:"Action details"});
 const old=C.parse(first.markdown);old.journal.items[0].kind="project";old.journal.items[0].details="Project notes";
 old.journal.bullets.push({...old.journal.bullets[0],id:"second",action:"B"});
 const migrated=C.serialize(old),j=C.parse(migrated).journal;
 check(j.notes[0].rows[0].text==="Project notes"&&j.bullets[0].itemId!==j.bullets[1].itemId,"project migration");
 check(C.getBullet(C.setBulletStatus(migrated,"second","done"),first.bulletId).status==="todo","independent completion");
 status.textContent="PASS";
 }catch(error){status.textContent="FAIL "+error.stack}
};
</script>
