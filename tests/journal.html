<!doctype html><meta charset="utf-8"><title>Journal UI tests</title><pre id="results"></pre><iframe src="../index.html" style="width:1250px;height:650px"></iframe>
<script>
if(location.search.includes('mobile'))document.querySelector('iframe').style.width='390px';
document.querySelector('iframe').addEventListener('load',function(){const w=this.contentWindow,d=this.contentDocument,c=w.DriveMemoContent,out=document.querySelector('#results');function check(name,ok){out.textContent+=(ok?'PASS ':'FAIL ')+name+'\n'}
const today=c.localDateKey(),tomorrow=c.shiftDate(today,1),far=c.shiftDate(today,100),a=c.addBullet('',{action:'Drag me',date:today,pending:true,priority:'today'}),editor=d.querySelector('#editor');editor.value=c.addBullet(a.markdown,{action:'Future',date:far,priority:'urgent'}).markdown;editor.dispatchEvent(new w.Event('input'));
function swipe(node,from,to,pointerId){node.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId,button:0,clientX:from,clientY:100}));node.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId,button:0,clientX:to,clientY:102}));node.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId,button:0,clientX:to,clientY:102}))}
swipe(d.querySelector('#agenda article'),100,190,11);check('right swipe completes todo Action',c.getBullet(editor.value,a.bulletId).status==='done');swipe(d.querySelector(`#agenda article[data-id="${a.bulletId}"]`),100,190,12);check('right swipe restores Done Action',c.getBullet(editor.value,a.bulletId).status==='todo');
const source=d.querySelector(`#agenda article[data-id="${a.bulletId}"]`),handle=source.querySelector('.action-drag-handle'),target=d.querySelector(`#agenda [data-date="${tomorrow}"]`),data=new w.DataTransfer();handle.dispatchEvent(new w.DragEvent('dragstart',{bubbles:true,dataTransfer:data}));target.dispatchEvent(new w.DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:data}));
check('only compact left handle is draggable',handle.draggable&&!source.draggable&&source.firstElementChild===handle&&!source.querySelector('.status-btn'));
if(w.innerWidth<=820)check('mobile priority stays on the Action row',Math.abs(source.querySelector('.bullet-main').getBoundingClientRect().top-source.querySelector('.priority-label').getBoundingClientRect().top)<22&&handle.getBoundingClientRect().width<=44);
check('drop preview before mutation',target.querySelector('.drop-preview')&&c.getBullet(editor.value,a.bulletId).date===today);
target.dispatchEvent(new w.DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:data}));check('drop changes date preserving pending',c.getBullet(editor.value,a.bulletId).date===tomorrow&&c.getBullet(editor.value,a.bulletId).pending&&!d.querySelector('.drop-preview'));
check('source day no longer contains action',!d.querySelector(`#agenda [data-date="${today}"] article`));
d.querySelector('[data-agenda-range=future]').click();check('future range includes distant action',d.querySelector(`#agenda [data-date="${far}"]`));check('future empty dates omitted',d.querySelectorAll('#agenda .agenda-day').length===9);
swipe(d.querySelector(`#agenda [data-date="${far}"] article`),190,90,13);check('left swipe moves Action to trash',c.getBullet(editor.value,c.getTrash(editor.value)[0].id).deletedAt&&c.getTrash(editor.value).length===1);d.querySelector('#debugNav').click();swipe(d.querySelector('[data-trash-id]'),190,90,14);check('left swipe in trash restores original date',!c.getBullet(editor.value,c.parse(editor.value).journal.bullets.find(b=>b.date===far).id).deletedAt&&c.getTrash(editor.value).length===0);d.querySelector('#journalNav').click();
d.querySelector('[data-agenda-range=week]').click();check('return to week',d.querySelectorAll('#agenda .agenda-day').length===8);
check('desktop calendar visible',w.getComputedStyle(d.querySelector('.journal-sidebar')).display!=='none');
const currentDate=today.slice(0,7)+'-01';let calendarText='';for(const priority of c.PRIORITIES){for(let i=0;i<2;i++)calendarText=c.addBullet(calendarText,{action:priority+i,date:currentDate,priority,status:i?'done':'todo'}).markdown}calendarText=c.addBullet(calendarText,{action:'Pending',date:currentDate,pending:true}).markdown;
const savedText=editor.value;editor.value=calendarText;editor.dispatchEvent(new w.Event('input'));
check('one dot per Action including Done and pending',d.querySelectorAll('.month-day .calendar-dot').length===9&&c.PRIORITIES.every(p=>d.querySelectorAll('.calendar-dot.'+p).length===2)&&d.querySelectorAll('.calendar-dot.pending').length===1);
const dot=d.querySelector('.calendar-dot'),dotStyle=w.getComputedStyle(dot);check('dots are 5 by 5 pixels',dotStyle.width==='5px'&&dotStyle.height==='5px');
check('no legend or numeric counters',!d.querySelector('.calendar-legend,.calendar-count')&&Array.from(d.querySelectorAll('.day-counts')).every(n=>n.textContent===''));
check('empty dates have no markers',d.querySelectorAll('.day-counts:not(:empty)').length===1);
editor.value=savedText;editor.dispatchEvent(new w.Event('input'));
const secondDate=today.slice(0,7)+'-02',scrollBefore=w.scrollY;d.querySelector(`[data-month-date="${currentDate}"]`).click();d.querySelector(`[data-month-date="${secondDate}"]`).click();check('calendar multi-select filters original timeline',d.querySelector(`[data-month-date="${currentDate}"]`).getAttribute('aria-pressed')==='true'&&d.querySelector(`[data-month-date="${secondDate}"]`).getAttribute('aria-pressed')==='true'&&d.querySelectorAll('#agenda .agenda-day').length===2&&d.querySelector(`#agenda [data-date="${currentDate}"]`)&&d.querySelector(`#agenda [data-date="${secondDate}"]`)&&!d.querySelector('#calendarActions'));check(`calendar selection keeps scroll position (${scrollBefore} to ${w.scrollY})`,w.scrollY===scrollBefore);
d.querySelector('[data-agenda-range=week]').click();check('week reset clears calendar selection',d.querySelectorAll('.month-day[aria-pressed=true]').length===0&&d.querySelectorAll('#agenda .agenda-day').length===8);
d.querySelector('#quickMemoBtn').click();check('Quick action opens text-only editor',d.querySelector('#actionField').classList.contains('hidden')&&d.querySelector('#bulletDialog').dataset.pending==='true');
d.querySelector('#projectRichEditor .outline-line').textContent='Memo body';d.querySelector('#bulletForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));const memo=c.parse(editor.value).journal.bullets.find(b=>b.action==='Unnamed action！');check('Quick action saved today and pending',memo&&memo.date===today&&memo.pending);
d.querySelector(`#agenda [data-action=open][data-id="${memo.id}"]`).click();d.querySelector('[data-priority=today]').click();d.querySelector('#bulletForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));check('priority click clears pending',!c.getBullet(editor.value,memo.id).pending);
});
</script>
