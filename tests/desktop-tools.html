<!doctype html><meta charset="utf-8"><title>Desktop editor tools and projects</title><pre id="results"></pre><iframe src="../index.html" style="width:1250px;height:800px;border:0"></iframe>
<script>
if(location.search.includes('narrow'))document.querySelector('iframe').style.width='900px';
document.querySelector('iframe').addEventListener('load',async function(){const w=this.contentWindow,d=this.contentDocument,c=w.DriveMemoContent,out=document.querySelector('#results'),wait=()=>new Promise(r=>setTimeout(r,250)),check=(name,ok)=>out.textContent+=(ok?'PASS ':'FAIL ')+name+'\n';try{
const a=c.addBullet('',{action:'First',details:'Notes'}),p=c.addBullet(a.markdown,{action:'Project action'}),q=c.addBullet(p.markdown,{action:'Second project action'});let text=c.convertToProject(q.markdown,p.bulletId);text=c.convertToProject(text,q.bulletId);text=c.updateProject(text,p.itemId,{title:'First project',details:'Project notes'});text=c.updateProject(text,q.itemId,{title:'Second project',details:'Other notes'});d.querySelector('#editor').value=text;d.querySelector('#editor').dispatchEvent(new w.Event('input'));
const dialog=d.querySelector('#bulletDialog'),toolbar=d.querySelector('#projectDetailsTools'),colors=d.querySelector('#projectTextColors'),sizes=d.querySelector('#projectTextSize'),multi=d.querySelector('#multiTools'),cancel=d.querySelector('#cancelBulletBtn'),vertical=panel=>{const rects=[...panel.querySelectorAll('button')].map(b=>b.getBoundingClientRect());return rects.every((r,i)=>!i||Math.abs(r.left-rects[0].left)<1&&r.top>=rects[i-1].bottom)};
d.querySelector('#agenda .bullet-main[data-id="'+a.bulletId+'"]').click();await wait();check('tools start below cancel',toolbar.getBoundingClientRect().top>=cancel.getBoundingClientRect().bottom);check('colors visible and vertical by default',w.getComputedStyle(colors).display!=='none'&&vertical(colors));
toolbar.querySelector('[data-detail-tool=select]').click();await wait();check('multi tools open vertically to the right',vertical(multi)&&multi.getBoundingClientRect().left>=toolbar.getBoundingClientRect().right);check('multi tools stay out of text area',multi.getBoundingClientRect().left>=dialog.querySelector('.dialog-body').getBoundingClientRect().right);
toolbar.querySelector('[data-detail-tool=sizes]').click();await wait();check('sizes vertical to the right',vertical(sizes)&&sizes.getBoundingClientRect().left>=toolbar.getBoundingClientRect().right);check('colors do not overlap sizes',colors.getBoundingClientRect().left>=sizes.getBoundingClientRect().right);
colors.querySelector('button').click();check('palette remains open after selection',w.getComputedStyle(colors).display!=='none');cancel.click();
d.querySelector('#projectsNav').click();await wait();d.querySelector('[data-action=edit-project][data-item-id="'+p.itemId+'"]').click();await wait();check('project opens in right nonmodal panel',dialog.open&&!dialog.matches(':modal')&&dialog.parentElement.matches('.projects-sidebar'));check('project list remains beside editor',d.querySelector('.projects-timeline').getBoundingClientRect().right<=dialog.getBoundingClientRect().left);
d.querySelector('#bulletTitle').value='Edited project';d.querySelector('#bulletTitle').dispatchEvent(new w.Event('input',{bubbles:true}));d.querySelector('[data-action=edit-project][data-item-id="'+q.itemId+'"]').click();await wait();check('switch project saves previous edits',c.getProjects(d.querySelector('#editor').value).find(x=>x.id===p.itemId).title==='Edited project'&&d.querySelector('#bulletTitle').value==='Second project');
d.querySelector('#bulletTitle').value='Cancelled title';d.querySelector('#bulletTitle').dispatchEvent(new w.Event('input',{bubbles:true}));await wait();cancel.click();check('cancel rolls back and restores project list',c.getProjects(d.querySelector('#editor').value).find(x=>x.id===q.itemId).title==='Second project'&&!d.body.classList.contains('project-dock-open'));
d.querySelector('[data-action=edit-project][data-item-id="'+p.itemId+'"]').click();await wait();this.style.width='390px';await wait();check('mobile uses modal and collapsible colors',dialog.matches(':modal')&&w.getComputedStyle(colors).display==='none'&&!d.querySelector('.editor-tools-rail'));this.style.width='1000px';await wait();check('desktop resize restores project dock and palette',!dialog.matches(':modal')&&dialog.parentElement.matches('.projects-sidebar')&&w.getComputedStyle(colors).display!=='none');d.querySelector('#journalNav').click();await wait();check('navigation closes project editor',!dialog.open&&!d.body.classList.contains('action-dock-open'));
}catch(error){out.textContent+='FAIL '+error.stack}});
</script>
