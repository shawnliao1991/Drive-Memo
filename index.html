<template id="reminderTestTemplate">
<section class="debug-card reminder-test" aria-labelledby="reminderTestHeading">
 <h2 id="reminderTestHeading">iPhone 離線提醒測試</h2>
 <p class="muted">將一筆測試提醒交給 Apple 捷徑，確認寫入手機後，再測試斷網響鈴。請在 iPhone 開啟此頁。</p>
 <form id="reminderTestForm">
  <div class="form-grid">
   <div class="field"><label for="reminderTestTitle">測試標題</label><input id="reminderTestTitle" type="text" maxlength="160" required value="Drive Memo 離線提醒測試"></div>
   <div class="field"><label for="reminderTestTime">提醒時間（目前裝置時區）</label><input id="reminderTestTime" type="datetime-local" required></div>
  </div>
  <div class="row"><button id="reminderTestLater" type="button" class="btn">五分鐘後</button><button type="submit" class="btn primary">在 iPhone 執行測試捷徑</button><button id="reminderTestCopy" type="button" class="btn">複製測試資料</button></div>
 </form>
 <p id="reminderTestStatus" class="muted" role="status" aria-live="polite"></p>
 <details open><summary>第一次使用：建立接收捷徑</summary>
  <p>先在 Apple「提醒事項」的 iCloud 區域建立「Drive Memo 測試」列表，再到「捷徑」（簡體介面為「快捷指令」）新增捷徑，名稱必須是 <strong>Drive Memo 提醒測試</strong>。</p>
  <ol>
   <li>加入「從輸入取得辭典」（Get Dictionary from Input），輸入選「捷徑輸入」。</li>
   <li>加入「取得辭典值」（Get Dictionary Value），鍵填 <code>title</code>，來源選步驟 1 的辭典。將輸出變數重新命名為「測試標題」。</li>
   <li>再加入「取得辭典值」，鍵填 <code>dueAt</code>，來源也要選步驟 1 的辭典，不是上一個步驟的標題。</li>
   <li>加入「從輸入取得日期」（Get Dates from Input），輸入選步驟 3 的 <code>dueAt</code> 值。這個動作的輸出圖示是紅色日曆，後面要使用它。</li>
   <li>加入「新增提醒事項」（Add New Reminder）：標題選步驟 2 的 <code>title</code> 值，列表選「Drive Memo 測試」。直接點主句中的藍色「提示」，選「選取變數」，再選步驟 4 輸出的<strong>紅色日曆「日期」</strong>。不要把日期放在展開後的「觸發」欄位；iOS 26 會把它誤判成位置。若有「緊急」開關，將它開啟。</li>
   <li>最後加入「顯示結果」（Show Result），內容選步驟 5 新增的提醒事項，方便檢查是否寫入。</li>
  </ol>
  <p>儲存後回到此頁，按「五分鐘後」，再按「在 iPhone 執行測試捷徑」。首次執行請允許捷徑存取提醒事項。各步驟名稱可能因手機語言不同而略有差異。</p>
  <p><strong>看到「未提供提示位置」：</strong>先清除展開區「觸發」右側的所有變數，再把上一步紅色日曆的「日期」直接指定給主句中的藍色「提示」。若仍報錯，刪除「新增提醒事項」動作後重新加入，先設定標題和列表，最後才點「提示」放入日期。</p>
  <p><strong>若捷徑裡沒有「緊急」選項：</strong>先完成一般提醒寫入，再到提醒事項的日期與時間設定手動開啟「緊急」。這樣仍可分別驗證資料傳送與離線鬧鐘，尚不能算全自動設定成功。</p>
 </details>
 <details><summary>第二步：驗證離線鬧鐘</summary>
  <ol>
   <li>在提醒事項確認測試標題、日期與分鐘都正確，且已啟用「緊急」。</li>
   <li>在「設定 → App → 提醒事項」允許鬧鐘；在「尋找 → 本人」確認以這支 iPhone 分享位置。緊急提醒只會在該裝置響鈴。</li>
   <li>確認時間尚未到，開啟飛航模式，並關閉 Wi-Fi，然後鎖屏等候。</li>
   <li>記錄是否準時響鈴、是否有停止／稍後提醒操作；測完可刪除「Drive Memo 測試」列表中的測試項目。</li>
  </ol>
  <p class="muted">本次只傳送一筆測試資料，不會修改日誌。再次執行會新增另一筆提醒；Action 改期、取消與完成尚未同步到手機。</p>
 </details>
 <details><summary>檢查傳送資料</summary><p class="muted">dueAt 使用 UTC 時間（Z 結尾）；捷徑轉成日期後，應顯示與上方相同的本地時間。</p><pre id="reminderTestPreview"></pre></details>
 <p class="muted"><a href="https://support.apple.com/zh-tw/guide/shortcuts/apd624386f42/ios" target="_blank" rel="noopener noreferrer">Apple 捷徑串接說明</a> · <a href="https://support.apple.com/zh-tw/102484" target="_blank" rel="noopener noreferrer">Apple 緊急提醒說明</a></p>
</section>
