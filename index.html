<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Drive Memo">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Drive Memo v2</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box} body{margin:0;background:#f6f7f9;color:#17191c}
header{position:sticky;top:0;z-index:5;padding:12px 16px;background:rgba(255,255,255,.94);border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;flex-wrap:wrap;backdrop-filter:blur(10px)}
header strong{margin-right:auto} main{max-width:1180px;margin:18px auto;padding:0 14px 40px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} input,textarea,button{font:inherit}
input{padding:9px 10px;border:1px solid #bbb;border-radius:8px;min-width:280px;flex:1}
button{padding:9px 13px;border:1px solid #aaa;border-radius:8px;background:#fff;cursor:pointer}
button.primary{background:#17191c;color:#fff;border-color:#17191c} button.danger{background:#8d1b1b;color:#fff;border-color:#8d1b1b}
button:disabled{opacity:.45;cursor:not-allowed}.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px;color:#555}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#999;margin-right:5px}.dot.ok{background:#1a7f4b}.dot.sync{background:#b07100}.dot.err{background:#b42318}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} textarea{width:100%;min-height:62vh;border:1px solid #bbb;border-radius:10px;padding:12px;line-height:1.55;resize:vertical}
#preview{min-height:62vh;border:1px solid #ddd;border-radius:10px;padding:18px;overflow:auto}#preview img{max-width:100%}#preview pre{overflow:auto;background:#f3f4f6;padding:10px;border-radius:8px}
#preview code{background:#f3f4f6;padding:2px 4px;border-radius:4px}.muted{color:#666;font-size:13px}
dialog{width:min(980px,95vw);max-height:90vh;border:0;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(0,0,0,.45)}
.modal-head{padding:14px 16px;border-bottom:1px solid #ddd}.modal-body{padding:14px 16px;overflow:auto;max-height:65vh}.modal-actions{padding:14px 16px;border-top:1px solid #ddd;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.diff{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.diff-add{background:#e9f7ef}.diff-del{background:#fdecec;text-decoration:line-through}.diff-same{color:#666}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.diff-pane{border:1px solid #ddd;border-radius:8px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}textarea,#preview{min-height:45vh}.diff-grid{grid-template-columns:1fr}input{min-width:180px}}
</style>
</head>
<body>
<header><strong>Drive Memo v2</strong><span id="identity" class="muted"></span><button id="loginBtn" class="primary">连接 Google</button><button id="logoutBtn" disabled>登出</button></header>
<main>
<section class="card">
<div class="row"><label for="fileId">Drive File ID</label><input id="fileId" placeholder="第一次贴上，之后会自动记住"><button id="openBtn" disabled>打开</button><button id="syncBtn" disabled>立即同步</button></div>
<div class="status"><span><span id="stateDot" class="dot"></span><span id="statusText">尚未连接 Google</span></span><span id="fileMeta"></span><span id="dirtyState"></span></div>
</section>
<section class="grid">
<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">编辑</h3><span class="muted">停止输入 1.2 秒后自动保存</span></div><textarea id="editor" placeholder="# 我的主题&#10;&#10;开始输入…"></textarea></div>
<div class="card"><h3 style="margin-top:0">呈现</h3><div id="preview"></div></div>
</section>
</main>
<dialog id="conflictDialog">
<div class="modal-head"><h3 style="margin:0 0 6px">发现同步冲突</h3><div class="muted">你本机有尚未同步的修改，同时 Drive 也出现了另一版。为避免覆盖，我先暂停自动保存。</div></div>
<div class="modal-body"><div id="diffView" class="diff"></div><div class="diff-grid"><div><strong>本机版本</strong><div id="localConflict" class="diff-pane"></div></div><div><strong>云端版本</strong><div id="cloudConflict" class="diff-pane"></div></div></div></div>
<div class="modal-actions"><button id="laterBtn">暂不处理</button><button id="cloudBtn">使用云端版</button><button id="localBtn" class="danger">保留本地并覆盖云端</button></div>
</dialog>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body></html>
