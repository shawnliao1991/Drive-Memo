<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drive Memo Prototype</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background:#f6f7f9; color:#17191c; }
    header { padding:14px 18px; background:white; border-bottom:1px solid #ddd; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    main { max-width:1100px; margin:20px auto; padding:0 14px; }
    .card { background:white; border:1px solid #ddd; border-radius:12px; padding:16px; margin-bottom:14px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    input, textarea, button { font:inherit; }
    input { padding:9px 10px; border:1px solid #bbb; border-radius:8px; min-width:260px; }
    button { padding:9px 13px; border:1px solid #aaa; border-radius:8px; background:white; cursor:pointer; }
    button.primary { background:#17191c; color:white; border-color:#17191c; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    textarea { width:100%; min-height:360px; box-sizing:border-box; border:1px solid #bbb; border-radius:10px; padding:12px; line-height:1.5; resize:vertical; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    #preview { min-height:360px; border:1px solid #ddd; border-radius:10px; padding:16px; overflow:auto; }
    #status { font-size:14px; color:#555; }
    .ok { color:#16794b !important; }
    .err { color:#b42318 !important; }
    code { background:#f1f2f4; padding:2px 5px; border-radius:5px; }
    @media (max-width:800px){ .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <strong>Drive Memo Prototype</strong>
    <button id="loginBtn" class="primary">Google 登入</button>
    <button id="logoutBtn" disabled>登出</button>
    <span id="identity"></span>
  </header>

  <main>
    <section class="card">
      <div class="row">
        <label>Drive File ID</label>
        <input id="fileId" placeholder="贴上 .md 文件的 File ID" />
        <button id="loadBtn" disabled>读取</button>
        <button id="saveBtn" disabled>写回 Drive</button>
      </div>
      <p id="status">尚未登入。</p>
    </section>

    <section class="grid">
      <div class="card">
        <h3>编辑</h3>
        <textarea id="editor" placeholder="# 我的主题&#10;&#10;在这里编辑 Markdown…"></textarea>
      </div>
      <div class="card">
        <h3>网页呈现</h3>
        <div id="preview"></div>
      </div>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
