<html lang="zh-Hant">
<head>

<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>牛馬日誌</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2026;background:#f2f3f5;--red:#d63b3b;--green:#27865a;--blue:#3478c7;--ink:#171a1f;--line:#dcdfe4}
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#1d2026}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:#6b7280;font-size:13px}

.journal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;max-width:820px;margin:4px auto 16px}.date-title h1{margin:0;font-size:28px}.date-title p{margin:3px 0 0;color:#737983;font-size:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(20,24,31,.03)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panel h2{margin:0;font-size:17px}.count{min-width:24px;padding:2px 7px;border-radius:99px;background:#eef0f3;color:#626973;text-align:center;font-size:12px;font-weight:700}

.rollover{margin-bottom:16px;border-color:#e3c577;background:#fffaf0}.rollover-list{display:grid;gap:6px;margin:10px 0}.rollover-row{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;background:rgba(255,255,255,.7)}.rollover-row input{width:18px;height:18px}.rollover-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.agenda{display:grid;gap:14px;max-width:820px;margin:0 auto}.agenda-day{scroll-margin-top:78px}.agenda-day.today-day{border-color:#aeb5bf;box-shadow:0 4px 16px rgba(20,24,31,.07)}.agenda-day.tomorrow-day{border-color:#cbd6e4}.agenda-date{margin-bottom:11px;padding-bottom:11px;border-bottom:1px solid #e7e9ed}.agenda-date time{display:flex;align-items:baseline;gap:8px;color:#23272e;font-size:20px;font-weight:780}.agenda-date time strong{font-size:14px}.agenda-day.weekend .agenda-date time{color:#999fa8}.agenda-section+.agenda-section{margin-top:14px}.agenda-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.agenda-section-head h3{margin:0;font-size:14px}.agenda .bullet-list{gap:7px}.agenda-done summary{cursor:pointer;list-style:none}.agenda-done summary::-webkit-details-marker{display:none}.agenda-done .bullet-list{margin-top:8px}.migrated-tag{color:#8a9099;font-size:11px}
.projects{display:grid;gap:12px;max-width:820px;margin:0 auto}.project-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.project-card.closed{background:#f7f7f8;color:#7a8089}.project-main{min-width:0;border:0;background:transparent;padding:0;text-align:left}.project-title-row{display:flex;align-items:center;gap:8px}.project-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}.project-badge{padding:3px 7px;border-radius:99px;background:#e8f4ed;color:#176642;font-size:11px;font-weight:750}.project-card.closed .project-badge{background:#e6e8eb;color:#676e78}.project-action{display:block;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5f6670}.project-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;color:#858b94;font-size:12px}.project-actions{display:flex;gap:7px;align-items:center}.projects-head{max-width:820px;margin:4px auto 16px}.projects-head h1{margin:0;font-size:28px}.projects-head p{margin:3px 0 0;color:#737983;font-size:13px}
.fab{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));z-index:15;width:58px;height:58px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:31px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.24)}
.debug-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.debug-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row input[type="text"]{min-width:220px;flex:1;padding:9px 10px;border:1px solid #b8bdc5;border-radius:8px}.debug-card textarea{width:100%;min-height:58vh;padding:12px;border:1px solid #bbb;border-radius:10px;line-height:1.5;resize:vertical}#preview{min-height:58vh;padding:16px;border:1px solid #ddd;border-radius:10px;overflow:auto}#preview img{max-width:100%}#preview pre{overflow:auto;background:#f3f4f6;padding:10px;border-radius:8px}
.state-lab{margin:0 0 20px;padding:14px;border:1px solid #cfd5df;border-radius:12px;background:#f8fafc}.state-lab-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.state-lab h4{margin:0 0 3px}.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.state-field{padding:10px;border:1px solid #e1e5ea;border-radius:9px;background:#fff}.state-label,.state-field>label{display:block;margin-bottom:7px;font-size:12px;font-weight:700}.state-check,.state-switch{display:flex;align-items:center;gap:8px}.state-check input{width:18px;height:18px}.state-switch-track{width:44px;height:24px;padding:3px;border-radius:99px;background:#aeb6c2}.state-switch-track:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#fff}.state-switch input{position:absolute;opacity:0}.state-switch input:checked+.state-switch-track{background:#2563eb}.state-switch input:checked+.state-switch-track:after{transform:translateX(20px)}.state-options{display:flex;gap:5px}.state-options input{position:absolute;opacity:0}.state-options label{padding:6px 8px;border:1px solid #aaa;border-radius:7px}.state-options input:checked+label{background:#17191c;color:#fff}.state-field input[type="text"],.state-field select{width:100%;min-width:0;padding:8px;border:1px solid #aaa;border-radius:7px}.state-range{display:flex;align-items:center;gap:8px}.state-range input{min-width:0;width:100%}.state-sync-badge{font-size:11px;color:#176642}
dialog{width:min(620px,calc(100vw - 24px));max-height:90vh;border:0;border-radius:17px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(0,0,0,.46)}.dialog-head{padding:16px 18px;border-bottom:1px solid var(--line)}.dialog-head h2,.dialog-head h3{margin:0}.dialog-body{padding:16px 18px;overflow:auto;max-height:64vh}.dialog-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}.dialog-left{display:flex;gap:8px;margin-right:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field>label,.field>.field-label{font-size:13px;font-weight:700;color:#525965}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #b8bec8;border-radius:9px;background:#fff}.field textarea{min-height:120px;resize:vertical}.priority-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.priority-option{display:flex;min-height:42px;align-items:center;justify-content:center;gap:6px;padding:7px 6px;border:1px solid #c9cdd3;border-radius:9px;background:#fff;color:#555b64;font-size:12px}.priority-option::before{content:"";width:9px;height:9px;border-radius:50%;background:#b8bdc5}.priority-option[data-priority="urgent"]::before{background:var(--red)}.priority-option[data-priority="today"]::before{background:var(--green)}.priority-option[data-priority="soon"]::before{background:var(--blue)}.priority-option.active{font-weight:750}.priority-option[data-priority="urgent"].active{border-color:var(--red);background:#fde9e9;color:#a42323}.priority-option[data-priority="today"].active{border-color:var(--green);background:#e5f4ec;color:#176642}.priority-option[data-priority="soon"].active{border-color:var(--blue);background:#e8f1fb;color:#245e9f}.priority-option[data-priority="someday"].active{border-color:#707782;background:#eef0f3;color:#30353c}.date-field{position:relative}.date-trigger{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px;border:1px solid #b8bec8;border-radius:9px;background:#fff;text-align:left}.date-trigger::after{content:"▾";color:#737983}.date-picker{position:absolute;top:100%;left:0;z-index:5;width:min(320px,calc(100vw - 60px));margin-top:5px;padding:10px;border:1px solid #cfd3d9;border-radius:12px;background:#fff;box-shadow:0 12px 30px rgba(20,24,31,.18)}.calendar-head{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;margin-bottom:8px}.calendar-head strong{text-align:center}.calendar-nav{width:34px;height:34px;border:0;border-radius:8px;background:#f1f2f4}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.calendar-weekdays span{text-align:center;padding:4px 0;color:#767d87;font-size:11px;font-weight:750}.calendar-weekdays .weekend,.calendar-day.weekend{color:#cf3636}.calendar-day,.calendar-blank{aspect-ratio:1;display:grid;place-items:center}.calendar-day{border:0;border-radius:8px;background:transparent;font-size:13px}.calendar-day:hover{background:#f0f1f3}.calendar-day.today-date{box-shadow:inset 0 0 0 1px #aeb4bd}.calendar-day.selected{background:#20242a;color:#fff;font-weight:800}.calendar-day.selected.weekend{background:#cf3636;color:#fff}.diff{font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap}.diff-add{background:#e9f7ef}.diff-del{background:#fdecec;text-decoration:line-through}.diff-same{color:#666}.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.diff-pane{max-height:240px;overflow:auto;padding:10px;border:1px solid #ddd;border-radius:8px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:12px;transform:translateX(-50%);padding:11px 14px;border-radius:11px;background:#20242a;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}.toast button{border:0;background:transparent;color:#9cc6ff;font-weight:750}
.bullet-history{display:grid;gap:6px}.history-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 9px;border:1px solid #e3e6ea;border-radius:9px;background:#fafbfc;font-size:13px}.history-row .history-action{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-state{color:#737a84;font-size:11px}
@media(max-width:820px){.topbar{flex-wrap:wrap}.brand{margin-right:auto}.nav{order:3;width:100%;overflow:auto}.identity{display:none}.journal-head{align-items:flex-start}.debug-grid{grid-template-columns:1fr}.date-title h1,.projects-head h1{font-size:22px}.form-grid,.state-grid,.diff-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:13px}.bullet{min-height:62px}.project-card{grid-template-columns:1fr}.project-actions{justify-content:flex-end}.priority-picker{grid-template-columns:1fr 1fr}.dialog-actions{flex-wrap:wrap}.dialog-left{width:100%;margin-right:0}.fab{width:54px;height:54px}.debug-card textarea,#preview{min-height:44vh}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">牛馬日誌</div><nav class="nav"><a id="journalNav" href="#journal">日誌</a><a id="projectsNav" href="#projects">專案</a><a id="debugNav" href="#sync-debug">同步 Debug</a></nav><span id="identity" class="identity muted"></span><button id="loginBtn" class="btn primary">連接 Google</button><button id="logoutBtn" class="btn" disabled>登出</button></header>
<div class="sync-strip"><span><span id="stateDot" class="dot"></span><span id="statusText">尚未連接 Google</span></span><span id="fileMeta"></span><span id="dirtyState"></span></div>
<main>
<section id="journalPage" class="page">
 <div class="journal-head"><div class="date-title"><h1>時間軸</h1><p>先看今天與明天，往下是接下來一週</p></div></div>
 <section id="rolloverPanel" class="panel rollover hidden"><div class="panel-head"><div><h2>之前未完，今天接著做？</h2><div id="rolloverSummary" class="muted"></div></div></div><div id="rolloverList" class="rollover-list"></div><div class="rollover-actions"><button id="rolloverSelectedBtn" class="btn">順延勾選項目</button><button id="rolloverAllBtn" class="btn primary">全部順延到今天</button></div></section>
 <div id="agenda" class="agenda"></div>
 <button id="addBulletBtn" class="fab" aria-label="新增 Bullet">＋</button>
</section>
<section id="projectsPage" class="page hidden">
 <div class="projects-head"><h1>專案</h1><p>集中查看目前行動、預定日期與專案狀態</p></div>
 <div id="projectsList" class="projects"></div>
</section>
<section id="debugPage" class="page hidden">
 <section class="debug-card"><div class="row"><label for="fileId">Drive File ID</label><input id="fileId" type="text" placeholder="第一次貼上，之後會自動記住"><button id="openBtn" class="btn" disabled>開啟</button><button id="syncBtn" class="btn" disabled>立即同步</button></div></section>
 <section class="debug-grid"><div class="debug-card"><div class="panel-head"><h2>原始內容</h2><span class="muted">停止輸入 1.2 秒後自動儲存</span></div><textarea id="editor" placeholder="Drive 文件原始內容"></textarea></div><div class="debug-card"><h2>Sync Debug</h2><div id="preview"></div></div></section>
</section>
</main>
<dialog id="bulletDialog"><form id="bulletForm"><div class="dialog-head"><h2 id="bulletDialogTitle">新增 Bullet</h2></div><div class="dialog-body"><input id="bulletId" type="hidden"><div class="form-grid"><div class="field full"><label for="bulletTitle">事情或專案</label><input id="bulletTitle" maxlength="160" required placeholder="例如：Drive Memo"></div><div class="field full"><label for="bulletAction">今天的 Action</label><input id="bulletAction" maxlength="500" required placeholder="例如：完成牛馬日誌首頁"></div><div class="field date-field"><span class="field-label">日期</span><input id="bulletDate" type="hidden"><button id="bulletDateButton" type="button" class="date-trigger" aria-haspopup="dialog" aria-expanded="false"></button><div id="datePicker" class="date-picker hidden"><div class="calendar-head"><button type="button" class="calendar-nav" data-calendar="previous" aria-label="上一個月">‹</button><strong id="calendarTitle"></strong><button type="button" class="calendar-nav" data-calendar="next" aria-label="下一個月">›</button></div><div class="calendar-weekdays"><span class="weekend">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="weekend">六</span></div><div id="calendarGrid" class="calendar-grid"></div></div></div><div class="field"><span class="field-label">重要度</span><input id="bulletPriority" type="hidden" value="someday"><div id="priorityPicker" class="priority-picker" role="radiogroup" aria-label="重要度"><button type="button" class="priority-option" data-priority="urgent" role="radio">立即處理</button><button type="button" class="priority-option" data-priority="today" role="radio">今天完成</button><button type="button" class="priority-option" data-priority="soon" role="radio">這幾天</button><button type="button" class="priority-option" data-priority="someday" role="radio">慢慢做</button></div></div><div class="field full"><label id="bulletDetailsLabel" for="bulletDetails">事情細節</label><textarea id="bulletDetails" maxlength="12000" placeholder="背景、備註、下一步或相關資訊"></textarea></div><div id="bulletHistoryField" class="field full hidden"><label>行動歷程</label><div id="bulletHistory" class="bullet-history"></div></div></div></div><div class="dialog-actions"><div class="dialog-left"><button id="deleteBulletBtn" type="button" class="btn danger hidden">刪除</button><button id="convertProjectBtn" type="button" class="btn hidden">轉為專案</button></div><button id="cancelBulletBtn" type="button" class="btn">取消</button><button type="submit" class="btn primary">儲存</button></div></form></dialog>
<dialog id="conflictDialog"><div class="dialog-head"><h3>發現同步衝突</h3><div class="muted">本機有尚未同步的修改，同時 Drive 也出現另一版。為避免覆蓋，已暫停自動儲存。</div></div><div class="dialog-body"><div id="diffView" class="diff"></div><div class="diff-grid"><div><strong>本機版本</strong><div id="localConflict" class="diff-pane"></div></div><div><strong>雲端版本</strong><div id="cloudConflict" class="diff-pane"></div></div></div></div><div class="dialog-actions"><button id="laterBtn" class="btn">暫不處理</button><button id="cloudBtn" class="btn">使用雲端版</button><button id="localBtn" class="btn danger">保留本機並覆蓋雲端</button></div></dialog>
<div id="toast" class="toast hidden"><span id="toastText"></span><button id="undoDeleteBtn">復原</button></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<script src="./config.js"></script>
<script src="./content.js?v=20260905-6"></script>
<script src="./sync.js?v=20260905-5"></script>
<script src="./ui.js?v=20260905-6"></script>
</body>
</html>
