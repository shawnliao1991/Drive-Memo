.field-label-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.field-label-row label{font-size:13px;font-weight:700;color:#ccc}.field-link{padding:4px 8px;font-size:11px}.rich-only-control{display:flex;align-items:center;gap:5px}.rich-only-control select,.rich-only-control input[type="color"]{height:31px;padding:3px 6px;border:1px solid #4a4a4a;border-radius:7px;background:#1e1e1e;color:#d4d4d4}.rich-only-control input[type="color"]{width:36px;padding:3px}.project-rich-editor{min-height:320px;padding:15px;overflow:auto;background:#1e1e1e;color:#d4d4d4;line-height:1.6;outline:none}.project-rich-editor:focus{box-shadow:inset 0 0 0 1px #007acc}.project-rich-editor:empty::before{content:attr(data-placeholder);color:#6f6f6f;pointer-events:none}.project-rich-editor a{color:#4daafc;text-decoration:underline}.project-rich-editor details{margin:5px 0;padding:4px 7px;border-radius:7px}.project-rich-editor details:hover{background:#252526}.project-rich-editor summary{padding:3px 2px;cursor:text;font-weight:650}.project-rich-editor .outline-body{padding:3px 0 4px 25px;color:#c7c7c7}.project-rich-editor .outline-body p{margin:3px 0}.project-rich-editor .outline-children{margin-left:23px;border-left:1px solid #3c3c3c;padding-left:10px}.project-details-render details{margin:4px 0}.project-details-render summary{cursor:pointer;font-weight:650}.project-details-render .outline-body{padding:3px 0 4px 25px}.project-details-render .outline-children{margin-left:23px;border-left:1px solid #3c3c3c;padding-left:10px}.rollover-copy{min-width:0}.rollover-priority{margin-left:auto}.project-card:target{outline:2px solid #007acc;outline-offset:3px}

<body>
<header class="topbar"><div class="brand">牛馬日誌</div><nav class="nav"><a id="journalNav" href="#journal">日誌</a><a id="projectsNav" href="#projects">專案</a><a id="debugNav" href="#sync-debug">同步 Debug</a></nav><span id="identity" class="identity muted"></span><button id="loginBtn" class="btn primary">連接 Google</button><button id="logoutBtn" class="btn" disabled>登出</button></header>
<div class="sync-strip"><span><span id="stateDot" class="dot"></span><span id="statusText">尚未連接 Google</span></span><span id="fileMeta"></span><span id="dirtyState"></span></div>
<main>
<section id="journalPage" class="page">
 <div class="journal-head"><div class="date-title"><h1>時間軸</h1><p>先看今天與明天，往下是接下來一週</p></div></div>
 <section id="rolloverPanel" class="panel rollover hidden"><div class="panel-head"><div><h2>之前未完，今天接著做？</h2><div id="rolloverSummary" class="muted"></div></div></div><div id="rolloverList" class="rollover-list"></div><div class="rollover-actions"><button id="rolloverSelectedBtn" class="btn">移動勾選 Action</button><button id="rolloverAllBtn" class="btn primary">全部移到今天</button></div></section>
 <div id="agenda" class="agenda"></div>
 <button id="addBulletBtn" class="fab" aria-label="新增 Action">＋</button>
</section>
<section id="projectsPage" class="page hidden">
 <div class="projects-head"><h1>專案</h1><p>集中查看專案內容、Action List 與專案狀態</p></div>
 <div id="projectsList" class="projects"></div>
</section>
<section id="debugPage" class="page hidden">
 <section class="debug-card"><div class="row"><label for="fileId">Drive File ID</label><input id="fileId" type="text" placeholder="第一次貼上，之後會自動記住"><button id="openBtn" class="btn" disabled>開啟</button><button id="syncBtn" class="btn" disabled>立即同步</button></div></section>
 <section class="debug-grid"><div class="debug-card"><div class="panel-head"><h2>原始內容</h2><span class="muted">停止輸入 1.2 秒後自動儲存</span></div><textarea id="editor" placeholder="Drive 文件原始內容"></textarea></div><div class="debug-card"><h2>Sync Debug</h2><div id="preview"></div></div></section>
</section>
</main>
<dialog id="bulletDialog"><form id="bulletForm"><div class="dialog-head"><h2 id="bulletDialogTitle">新增 Action</h2></div><div class="dialog-body"><input id="bulletId" type="hidden"><input id="bulletProjectId" type="hidden"><input id="bulletMode" type="hidden" value="action"><div class="form-grid"><div id="projectNameField" class="field full hidden"><label for="bulletTitle">所屬專案</label><input id="bulletTitle" maxlength="160" placeholder="專案名稱"></div><div id="actionField" class="field full"><label for="bulletAction">Action</label><input id="bulletAction" maxlength="500" required placeholder="要執行的一件具體事情"></div><div id="actionDateField" class="field date-field"><span class="field-label">日期</span><input id="bulletDate" type="hidden"><button id="bulletDateButton" type="button" class="date-trigger" aria-haspopup="dialog" aria-expanded="false"></button><div id="datePicker" class="date-picker hidden"><div class="calendar-head"><button type="button" class="calendar-nav" data-calendar="previous" aria-label="上一個月">‹</button><strong id="calendarTitle"></strong><button type="button" class="calendar-nav" data-calendar="next" aria-label="下一個月">›</button></div><div class="calendar-weekdays"><span class="weekend">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="weekend">六</span></div><div id="calendarGrid" class="calendar-grid"></div></div></div><div id="actionPriorityField" class="field"><span class="field-label">重要度</span><input id="bulletPriority" type="hidden" value="someday"><div id="priorityPicker" class="priority-picker" role="radiogroup" aria-label="重要度"><button type="button" class="priority-option" data-priority="urgent" role="radio">立即處理</button><button type="button" class="priority-option" data-priority="today" role="radio">今天完成</button><button type="button" class="priority-option" data-priority="soon" role="radio">這幾天</button><button type="button" class="priority-option" data-priority="someday" role="radio">慢慢做</button></div></div><div class="field full"><div class="field-label-row"><label id="bulletDetailsLabel" for="bulletDetails">Action 細節</label><button id="goToProjectBtn" type="button" class="btn field-link hidden">前往專案頁</button></div><div class="details-editor"><div id="projectDetailsTools" class="details-toolbar hidden"><button type="button" class="btn" data-detail-tool="add-block">＋ 收合項目</button><button type="button" class="btn" data-detail-tool="indent">增加階層</button><button type="button" class="btn" data-detail-tool="outdent">減少階層</button><button type="button" class="btn" data-detail-tool="bold">粗體</button><span class="rich-only-control"><select id="projectTextSize" aria-label="文字大小"><option value="3">一般文字</option><option value="2">小字</option><option value="5">大字</option></select><input id="projectTextColor" type="color" value="#d4d4d4" aria-label="文字顏色"></span><button id="projectImageBtn" type="button" class="btn">引用圖片</button><input id="projectImageInput" class="hidden" type="file" accept="image/*"><span class="upload-note">內容會直接呈現；三角形可展開或收合</span></div><div id="detailsWorkspace" class="details-workspace single"><textarea id="bulletDetails" maxlength="12000" placeholder="背景、備註、下一步或相關資訊"></textarea><div id="projectRichEditor" class="project-rich-editor hidden" contenteditable="true" role="textbox" aria-multiline="true" aria-label="專案內容" data-placeholder="輸入專案筆記，或新增一個可收合項目…"></div></div></div></div><div id="bulletHistoryField" class="field full hidden"><label>Action 歷程</label><div id="bulletHistory" class="bullet-history"></div></div></div></div><div class="dialog-actions"><div class="dialog-left"><button id="deleteBulletBtn" type="button" class="btn danger hidden">刪除</button><button id="convertProjectBtn" type="button" class="btn hidden">轉為專案 Action</button></div><button id="cancelBulletBtn" type="button" class="btn">取消</button><button type="submit" class="btn primary">儲存</button></div></form></dialog>
<dialog id="convertDialog"><form id="convertForm"><div class="dialog-head"><h3>轉為專案 Action</h3><div class="muted">建立一個專案，並把目前 Action 放入該專案。</div></div><div class="dialog-body"><div class="field"><label for="convertProjectName">專案名稱</label><input id="convertProjectName" maxlength="160" required placeholder="例如：Drive Memo 改版"></div></div><div class="dialog-actions"><button id="cancelConvertBtn" type="button" class="btn">取消</button><button type="submit" class="btn primary">建立專案</button></div></form></dialog>
<dialog id="conflictDialog"><div class="dialog-head"><h3>發現同步衝突</h3><div class="muted">本機有尚未同步的修改，同時 Drive 也出現另一版。為避免覆蓋，已暫停自動儲存。</div></div><div class="dialog-body"><div id="diffView" class="diff"></div><div class="diff-grid"><div><strong>本機版本</strong><div id="localConflict" class="diff-pane"></div></div><div><strong>雲端版本</strong><div id="cloudConflict" class="diff-pane"></div></div></div></div><div class="dialog-actions"><button id="laterBtn" class="btn">暫不處理</button><button id="cloudBtn" class="btn">使用雲端版</button><button id="localBtn" class="btn danger">保留本機並覆蓋雲端</button></div></dialog>
<div id="imageHover" class="image-hover hidden"><span class="muted">載入預覽中…</span></div>
<dialog id="imageDialog" class="image-dialog"><div class="dialog-head"><h3 id="imageDialogTitle">圖片預覽</h3><button id="closeImageBtn" type="button" class="icon-btn" aria-label="關閉圖片">×</button></div><div class="dialog-body"><img id="imageDialogImg" alt="專案圖片"></div></dialog>
<div id="toast" class="toast hidden"><span id="toastText"></span><button id="undoDeleteBtn">復原</button></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<script src="./config.js"></script>
<script src="./content.js?v=20260905-10"></script>
<script src="./sync.js?v=20260905-7"></script>
<script src="./ui.js?v=20260905-10"></script>
</body>
</html>
